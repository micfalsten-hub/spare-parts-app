<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="./manifest.webmanifest"><title>تاجر قطع الغيار</title><style>
:root{--bg:#f8fafc;--c:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--a:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Tahoma}.app{max-width:760px;margin:auto;padding:14px 14px 88px}header{position:sticky;top:0;background:#f8fafcee;backdrop-filter:blur(10px);z-index:4;padding:12px 0}h1{font-size:22px;margin:0}.muted{color:var(--muted);font-size:13px}.hero{background:#0f172a;color:white;padding:20px;border-radius:24px;margin:8px 0 14px}.search input,.field input,.field select,.field textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:15px;background:white;font:inherit}.search{margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick,.card,.item{background:white;border:1px solid var(--line);border-radius:20px}.quick{padding:16px;text-align:right}.quick b{display:block;margin-top:6px}.title{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.list{display:grid;gap:9px}.item{display:flex;width:100%;align-items:center;gap:10px;padding:11px;text-align:right}.thumb{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#e2e8f0}.grow{flex:1;min-width:0}.price{font-weight:800}.page{display:none}.page.active{display:block}.card{padding:16px;margin-bottom:12px}.btn{border:0;border-radius:15px;padding:13px 15px;font-weight:700}.primary{background:#0f172a;color:white}.amber{background:var(--a)}.soft{background:#f1f5f9}.danger{background:#fee2e2;color:#991b1b}.form{display:grid;gap:11px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 2px 5px}.back{margin-bottom:10px}.big{font-size:34px;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.photo{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:18px;background:#e2e8f0}.supplier{border:0;background:transparent;color:inherit;text-align:right}.badge{background:#f1f5f9;border-radius:999px;padding:5px 9px;font-size:12px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 5px;border-bottom:1px solid var(--line);text-align:right}.empty{padding:24px;text-align:center;color:var(--muted)}nav{position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--line);background:#fffffff2;backdrop-filter:blur(10px);z-index:10}nav div{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}nav button{border:0;background:transparent;padding:10px 4px;font-size:12px;color:var(--muted)}nav button span{display:block;font-size:21px}.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:999px;display:none;z-index:20}@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="app"><header><h1>تاجر قطع الغيار</h1><div class="muted">ذاكرة الأسعار والموردين</div></header><main>
<section id="home" class="page active"><div class="hero"><h2>دور على القطعة في ثواني</h2><div class="muted" style="color:#cbd5e1">السعر، آخر مورد، وآخر سعر شراء.</div></div><div class="search"><input id="q" placeholder="ابحث باسم القطعة..."></div><div class="grid">
<button class="quick" onclick="show('purchase')">🧾<b>إضافة شراء</b><span class="muted">سجل سعر مورد</span></button><button class="quick" onclick="show('productAdd')">📦<b>منتج جديد</b><span class="muted">قطعة وصورة</span></button><button class="quick" onclick="show('supplierAdd')">🏪<b>مورد جديد</b><span class="muted">عنوان وتليفون</span></button><button class="quick" onclick="show('suppliers')">📒<b>الموردين</b><span class="muted">كل الموردين</span></button></div><div class="title"><h3>المنتجات</h3><span id="pc" class="badge">0</span></div><div id="plist" class="list"></div></section>
<section id="suppliers" class="page"><div class="title"><h3>الموردين</h3><span id="sc" class="badge">0</span></div><div id="slist" class="list"></div></section>
<section id="productAdd" class="page"><button class="btn soft back" onclick="show('home')">→ رجوع</button><div class="card"><h3>منتج جديد</h3><form id="pf" class="form"><div class="field"><label>اسم المنتج *</label><input id="pn" required></div><div class="field"><label>سعر البيع الحالي</label><input id="ps" inputmode="decimal"></div><div class="field"><label>صورة المنتج</label><input id="pi" type="file" accept="image/*" capture="environment"></div><img id="preview" class="photo" style="display:none"><button class="btn amber">حفظ المنتج</button></form></div></section>
<section id="supplierAdd" class="page"><button class="btn soft back" onclick="show('suppliers')">→ رجوع</button><div class="card"><h3>مورد جديد</h3><form id="sf" class="form"><div class="field"><label>اسم المورد *</label><input id="sn" required></div><div class="field"><label>التليفون</label><input id="sp"></div><div class="field"><label>واتساب</label><input id="sw"></div><div class="field"><label>العنوان</label><textarea id="sa"></textarea></div><div class="field"><label>ملاحظات</label><textarea id="sno"></textarea></div><button class="btn amber">حفظ المورد</button></form></div></section>
<section id="purchase" class="page"><button class="btn soft back" onclick="show('home')">→ رجوع</button><div class="card"><h3>تسجيل شراء</h3><form id="bf" class="form"><div class="field"><label>المنتج *</label><select id="bp" required></select></div><div class="field"><label>المورد *</label><select id="bs" required></select></div><div class="field"><label>سعر الشراء *</label><input id="bpr" required inputmode="decimal"></div><div class="field"><label>سعر البيع المقترح</label><input id="bsp" inputmode="decimal"></div><div class="field"><label>التاريخ</label><input id="bd" type="date"></div><button class="btn amber">حفظ العملية</button></form></div></section>
<section id="product" class="page"><button class="btn soft back" onclick="show('home')">→ رجوع</button><div id="pdetail"></div></section><section id="supplier" class="page"><button class="btn soft back" onclick="show('suppliers')">→ رجوع</button><div id="sdetail"></div></section>
<section id="data" class="page"><div class="card"><h3>النسخ الاحتياطي</h3><p class="muted">النسخة التجريبية تحفظ البيانات على نفس الجهاز.</p><div class="actions"><button class="btn soft" onclick="backup()">تصدير نسخة</button><label class="btn soft" style="text-align:center">استيراد<input id="restore" type="file" accept=".json" hidden></label></div><button class="btn danger" style="width:100%;margin-top:9px" onclick="resetDB()">إعادة بيانات التجربة</button></div></section>
</main></div><nav><div><button onclick="show('home')"><span>⌂</span>الرئيسية</button><button onclick="show('suppliers')"><span>🏪</span>الموردين</button><button onclick="show('purchase')"><span>＋</span>شراء</button><button onclick="show('data')"><span>⚙</span>البيانات</button></div></nav><div id="toast" class="toast"></div>
<script>
const KEY='sparePartsTrader_v1';const seed={products:[{id:'P001',name:'تيل فرامل تويوتا',sellPrice:950,image:''},{id:'P002',name:'طلمبة مياه لانسر',sellPrice:1450,image:''},{id:'P003',name:'فلتر زيت نيسان',sellPrice:320,image:''}],suppliers:[{id:'S001',name:'المتحدة لقطع الغيار',phone:'',whatsapp:'',address:'',notes:''},{id:'S002',name:'النور لقطع الغيار',phone:'',whatsapp:'',address:'',notes:''},{id:'S003',name:'الشرق لقطع الغيار',phone:'',whatsapp:'',address:'',notes:''}],purchases:[{id:'B1',productId:'P001',supplierId:'S001',price:720,date:'2026-09-01'},{id:'B2',productId:'P002',supplierId:'S002',price:1180,date:'2026-09-02'},{id:'B3',productId:'P003',supplierId:'S003',price:240,date:'2026-09-03'}]};let db=load();let img='';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{return structuredClone(seed)}}function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function id(p){return p+Date.now().toString(36).toUpperCase()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(s){return String(s||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')}function money(n){return Number(n||0).toLocaleString('ar-EG-u-nu-latn')+' ج'}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}function show(x){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById(x).classList.add('active');render();scrollTo(0,0)}function P(i){return db.products.find(x=>x.id===i)}function S(i){return db.suppliers.find(x=>x.id===i)}function last(i){return db.purchases.filter(x=>x.productId===i).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]}
function render(){let q=norm(document.getElementById('q').value);let ps=db.products.filter(p=>!q||norm(p.name).includes(q));pc.textContent=ps.length;plist.innerHTML=ps.length?ps.map(p=>{let l=last(p.id),s=l&&S(l.supplierId);return `<button class="item" onclick="openP('${p.id}')"><div class="thumb" style="display:grid;place-items:center">${p.image?`<img class="thumb" src="${p.image}">`:'📦'}</div><div class="grow"><b>${esc(p.name)}</b><div class="muted">${s?'آخر مورد: '+esc(s.name):'بدون مورد'}</div></div><div class="price">${money(p.sellPrice)}</div></button>`}).join(''):'<div class="empty">لا توجد نتائج</div>';sc.textContent=db.suppliers.length;slist.innerHTML=db.suppliers.map(s=>`<button class="item" onclick="openS('${s.id}')"><div style="font-size:28px">🏪</div><div class="grow"><b>${esc(s.name)}</b><div class="muted">${s.phone?esc(s.phone):'بدون تليفون'}</div></div>‹</button>`).join('')||'<div class="empty">لا يوجد موردين</div>';bp.innerHTML='<option value="">اختر المنتج</option>'+db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');bs.innerHTML='<option value="">اختر المورد</option>'+db.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');if(!bd.value)bd.value=new Date().toISOString().slice(0,10)}
function openP(i){let p=P(i),rows=db.purchases.filter(x=>x.productId===i).sort((a,b)=>String(b.date).localeCompare(String(a.date))),l=rows[0],s=l&&S(l.supplierId);pdetail.innerHTML=`<div class="card">${p.image?`<img class="photo" src="${p.image}">`:'<div class="photo" style="display:grid;place-items:center">📦</div>'}<h2>${esc(p.name)}</h2><div class="muted">السعر عندك</div><div class="big">${money(p.sellPrice)}</div><div class="actions"><div><div class="muted">آخر سعر شراء</div><b>${l?money(l.price):'-'}</b></div><div><div class="muted">آخر مورد</div>${s?`<button class="supplier" onclick="openS('${s.id}')"><b>${esc(s.name)}</b></button>`:'-'}</div></div></div><div class="card"><h3>تاريخ الشراء</h3><table><tr><th>التاريخ</th><th>المورد</th><th>السعر</th></tr>${rows.map(x=>`<tr><td>${esc(x.date)}</td><td><button class="supplier" onclick="openS('${x.supplierId}')">${esc(S(x.supplierId)?.name||'-')}</button></td><td>${money(x.price)}</td></tr>`).join('')}</table></div>`;show('product')}
function openS(i){let s=S(i),rows=db.purchases.filter(x=>x.supplierId===i).sort((a,b)=>String(b.date).localeCompare(String(a.date)));sdetail.innerHTML=`<div class="card"><h2>${esc(s.name)}</h2><p><span class="muted">العنوان</span><br>${esc(s.address||'غير مسجل')}</p><p><span class="muted">التليفون</span><br>${esc(s.phone||'غير مسجل')}</p><div class="actions">${s.phone?`<a class="btn primary" href="tel:${esc(s.phone)}" style="text-align:center;text-decoration:none">اتصال</a>`:'<button class="btn soft">لا يوجد رقم</button>'}${(s.whatsapp||s.phone)?`<a class="btn amber" target="_blank" href="https://wa.me/${String(s.whatsapp||s.phone).replace(/\D/g,'').replace(/^0/,'20')}" style="text-align:center;text-decoration:none">WhatsApp</a>`:''}</div></div><div class="card"><h3>آخر القطع الموردة</h3><table><tr><th>التاريخ</th><th>القطعة</th><th>السعر</th></tr>${rows.map(x=>`<tr><td>${esc(x.date)}</td><td><button class="supplier" onclick="openP('${x.productId}')">${esc(P(x.productId)?.name||'-')}</button></td><td>${money(x.price)}</td></tr>`).join('')}</table></div>`;show('supplier')}
q.addEventListener('input',render);pi.addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{img=r.result;preview.src=img;preview.style.display='block'};r.readAsDataURL(f)});pf.addEventListener('submit',e=>{e.preventDefault();let n=pn.value.trim();if(db.products.some(p=>norm(p.name)==norm(n)))return toast('المنتج موجود');db.products.push({id:id('P'),name:n,sellPrice:Number(ps.value)||0,image:img});save();e.target.reset();img='';preview.style.display='none';toast('تم حفظ المنتج');show('home')});sf.addEventListener('submit',e=>{e.preventDefault();let n=sn.value.trim();if(db.suppliers.some(s=>norm(s.name)==norm(n)))return toast('المورد موجود');db.suppliers.push({id:id('S'),name:n,phone:sp.value.trim(),whatsapp:sw.value.trim(),address:sa.value.trim(),notes:sno.value.trim()});save();e.target.reset();toast('تم حفظ المورد');show('suppliers')});bf.addEventListener('submit',e=>{e.preventDefault();if(!bp.value||!bs.value||!Number(bpr.value))return toast('أكمل البيانات');db.purchases.push({id:id('B'),productId:bp.value,supplierId:bs.value,price:Number(bpr.value),date:bd.value});let p=P(bp.value);if(Number(bsp.value))p.sellPrice=Number(bsp.value);save();let pid=bp.value;e.target.reset();toast('تم تسجيل الشراء');openP(pid)});function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='spare-parts-backup.json';a.click()}restore.addEventListener('change',async e=>{try{let o=JSON.parse(await e.target.files[0].text());if(!o.products||!o.suppliers||!o.purchases)throw 0;db=o;save();toast('تم الاستيراد');show('home')}catch{toast('ملف غير صحيح')}});function resetDB(){if(confirm('حذف التعديلات وإعادة بيانات التجربة؟')){db=structuredClone(seed);save();show('home')}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
