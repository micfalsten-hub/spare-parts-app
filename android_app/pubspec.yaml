name: spare_parts
description: Arabic offline spare-parts trading notebook.
publish_to: none
version: 1.0.2+3
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  image_picker: ^1.2.1
  file_picker: ^10.3.10
  url_launcher: ^6.3.2
  archive: ^4.0.7
  crypto: ^3.0.6
  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
  fonts:
    - family: NotoArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
